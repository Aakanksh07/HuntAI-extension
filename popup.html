<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  body { width: 280px; margin: 0; background: #0b0c10; color: #F3F4F6; font-family: system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  h1 span { color: #6EE7B7; }
  .status { font-size: 13px; line-height: 1.6; color: #9CA3AF; margin-bottom: 12px; }
  .status.connected { color: #6EE7B7; }
  .email { font-size: 12px; color: #9CA3AF; margin-bottom: 12px; }
  button { width: 100%; background: #6EE7B7; color: #0b0c10; border: none; border-radius: 999px; padding: 9px; font-weight: 700; font-size: 13px; cursor: pointer; }
  button.secondary { background: transparent; color: #F3F4F6; border: 1px solid rgba(255,255,255,0.13); font-weight: 600; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  .dot.on { background: #6EE7B7; }
  .dot.off { background: #F87171; }
</style>
</head>
<body>
  <h1>Hunt<span>AI</span></h1>

  <div id="connected" style="display:none">
    <div class="status connected"><span class="dot on"></span>Connected</div>
    <div class="email" id="emailDisplay"></div>
    <button id="toggleOverlay" class="secondary" style="margin-bottom:10px;"></button>
    <div class="status">Click the 🎯 in the corner of any job application page to fill it — drag it anywhere on the page.</div>
  </div>

  <div id="disconnected" style="display:none">
    <div class="status"><span class="dot off"></span>Not connected</div>
    <div class="status">Sign in on the HuntAI website — the extension picks up your session automatically.</div>
    <button id="openSite">Open HuntAI</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
